<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CIRDRIO — Build What's Next.</title>

<meta name="description" content="CIRDRIO builds intelligent products, digital systems and ambitious technology for what comes next.">

<meta name="theme-color" content="#050711">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

:root{
    --bg:#04050a;
    --bg2:#080b18;
    --text:#f7f8ff;
    --muted:#8d94aa;
    --blue:#6176ff;
    --blue2:#2e4cff;
    --cyan:#38cfff;
    --line:rgba(255,255,255,.09);
    --glass:rgba(255,255,255,.045);
    --max:1180px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
}

::selection{
    background:#6376ff;
    color:#fff;
}

/* =========================================================
   BACKGROUND
========================================================= */

.scene{
    position:fixed;
    inset:0;
    z-index:-20;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(61,78,255,.20),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 25%,
            rgba(0,194,255,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(101,48,255,.16),
            transparent 38%
        ),
        #04050a;
}

.grid{
    position:absolute;
    width:160%;
    height:70%;
    left:-30%;
    bottom:-18%;
    opacity:.13;

    background-image:
        linear-gradient(
            rgba(110,130,255,.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(110,130,255,.18) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    transform:
        perspective(600px)
        rotateX(64deg);

    transform-origin:center bottom;

    mask-image:linear-gradient(
        to top,
        black,
        transparent 85%
    );
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
}

.orb-a{
    width:420px;
    height:420px;
    left:-230px;
    top:8%;
    background:#3146ff;
    opacity:.25;
    animation:orbA 12s ease-in-out infinite;
}

.orb-b{
    width:360px;
    height:360px;
    right:-180px;
    top:38%;
    background:#6635ff;
    opacity:.20;
    animation:orbB 14s ease-in-out infinite;
}

.orb-c{
    width:280px;
    height:280px;
    left:35%;
    bottom:-160px;
    background:#008cff;
    opacity:.18;
    animation:orbC 10s ease-in-out infinite;
}

@keyframes orbA{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(90px,40px)}
}

@keyframes orbB{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(-70px,-50px)}
}

@keyframes orbC{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-80px)}
}

/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:18px 4%;
}

.nav{
    width:min(var(--max),100%);
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    padding:9px 11px;

    border:1px solid var(--line);
    border-radius:18px;

    background:rgba(5,7,14,.72);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    box-shadow:
        0 20px 70px rgba(0,0,0,.30),
        inset 0 1px rgba(255,255,255,.04);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    text-decoration:none;
    min-width:max-content;
}

.logo{
    width:42px;
    height:42px;
    object-fit:contain;
    border-radius:11px;
    filter:
        drop-shadow(0 0 12px rgba(73,92,255,.35));
}

.brand-name{
    font-family:Manrope,Arial,sans-serif;
    font-size:13px;
    font-weight:800;
    letter-spacing:2.8px;
}

.links{
    display:flex;
    align-items:center;
    gap:27px;
}

.links a{
    color:#8c93a7;
    text-decoration:none;
    font-size:11px;
    font-weight:600;
    transition:.25s;
}

.links a:hover{
    color:#fff;
}

.nav-cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:11px 17px;

    border-radius:11px;

    color:#fff;
    text-decoration:none;

    font-size:11px;
    font-weight:700;

    background:
        linear-gradient(
            135deg,
            #7182ff,
            #3047df
        );

    box-shadow:
        0 10px 28px rgba(48,71,223,.28);
}

/* =========================================================
   HERO
========================================================= */

.hero{
    width:min(var(--max),100%);
    min-height:100vh;
    margin:auto;

    position:relative;

    display:flex;
    align-items:center;

    padding:
        150px 4%
        100px;
}

.hero-copy{
    position:relative;
    z-index:5;
    max-width:720px;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:9px;

    padding:8px 13px;

    border:1px solid rgba(102,124,255,.28);
    border-radius:999px;

    background:rgba(67,84,255,.08);

    color:#b2bcff;

    font-size:10px;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#52ffae;
    box-shadow:0 0 16px #52ffae;
}

.hero h1{
    margin-top:28px;

    font-family:Manrope,Arial,sans-serif;
    font-size:clamp(58px,8vw,104px);
    line-height:.92;
    letter-spacing:-6px;
    font-weight:800;
}

.hero-gradient{
    background:
        linear-gradient(
            110deg,
            #fff 0%,
            #cbd2ff 25%,
            #6680ff 50%,
            #fff 75%
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:gradientMove 7s linear infinite;
}

@keyframes gradientMove{
    to{
        background-position:250% center;
    }
}

.hero-text{
    max-width:650px;

    margin-top:28px;

    color:#949bad;

    font-size:15px;
    line-height:1.9;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;

    margin-top:34px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    min-height:48px;

    padding:0 19px;

    border-radius:12px;

    text-decoration:none;

    font-size:11px;
    font-weight:700;

    transition:
        transform .3s,
        box-shadow .3s,
        background .3s;
}

.btn-primary{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #7183ff,
            #3047e3
        );

    box-shadow:
        0 15px 40px rgba(48,71,227,.30);
}

.btn-primary:hover{
    transform:translateY(-4px);
    box-shadow:
        0 22px 50px rgba(48,71,227,.45);
}

.btn-secondary{
    color:#dfe2ef;

    border:1px solid var(--line);

    background:rgba(255,255,255,.045);
}

.btn-secondary:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.08);
}

/* =========================================================
   3D CORE
========================================================= */

.hero-visual{
    position:absolute;

    width:520px;
    height:520px;

    right:-30px;
    top:50%;

    transform:translateY(-50%);

    pointer-events:none;

    perspective:1000px;
}

.core-wrap{
    position:absolute;
    inset:0;

    transform-style:preserve-3d;

    animation:
        coreFloat 7s ease-in-out infinite,
        coreRotate 24s linear infinite;
}

.core-glow{
    position:absolute;

    width:220px;
    height:220px;

    left:150px;
    top:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(91,112,255,.48),
            rgba(49,71,230,.16) 45%,
            transparent 72%
        );

    filter:blur(12px);
}

.core{
    position:absolute;

    width:170px;
    height:170px;

    left:175px;
    top:175px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 24%,
            #ffffff,
            #a8b3ff 9%,
            #596dff 25%,
            #263ce4 48%,
            #090c22 72%,
            #02030a 100%
        );

    box-shadow:
        0 0 35px rgba(86,108,255,.65),
        0 0 100px rgba(65,84,255,.35),
        inset -30px -35px 45px rgba(0,0,0,.70),
        inset 12px 10px 25px rgba(255,255,255,.18);

    transform-style:preserve-3d;
}

.core::before{
    content:"";

    position:absolute;
    inset:15px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.24);

    box-shadow:
        inset 0 0 25px rgba(130,145,255,.20);
}

.core::after{
    content:"";

    position:absolute;

    width:42px;
    height:20px;

    top:28px;
    left:36px;

    border-radius:50%;

    background:rgba(255,255,255,.40);

    filter:blur(10px);

    transform:rotate(-30deg);
}

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    transform-style:preserve-3d;

    border:1px solid rgba(111,131,255,.34);
}

.orbit-1{
    width:390px;
    height:135px;

    margin-left:-195px;
    margin-top:-67px;

    transform:rotateX(66deg) rotateZ(-20deg);

    animation:orbit1 13s linear infinite;
}

.orbit-2{
    width:430px;
    height:155px;

    margin-left:-215px;
    margin-top:-77px;

    border-color:rgba(47,206,255,.25);

    transform:rotateX(70deg) rotateZ(40deg);

    animation:orbit2 17s linear infinite;
}

.orbit-3{
    width:300px;
    height:300px;

    margin-left:-150px;
    margin-top:-150px;

    border-color:rgba(92,113,255,.18);

    animation:orbit3 20s linear infinite;
}

@keyframes coreFloat{
    0%,100%{
        transform:translateY(0) rotateX(0);
    }

    50%{
        transform:translateY(-15px) rotateX(4deg);
    }
}

@keyframes coreRotate{
    to{
        rotate:360deg;
    }
}

@keyframes orbit1{
    to{
        transform:rotateX(66deg) rotateZ(340deg);
    }
}

@keyframes orbit2{
    to{
        transform:rotateX(70deg) rotateZ(-320deg);
    }
}

@keyframes orbit3{
    to{
        transform:rotateZ(360deg);
    }
}

.particle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#9aa8ff;

    box-shadow:
        0 0 14px #667cff;

    animation:particleFloat 5s ease-in-out infinite;
}

.p1{left:80px;top:150px}
.p2{right:80px;top:220px;animation-delay:-2s}
.p3{left:110px;bottom:120px;animation-delay:-4s}
.p4{right:130px;bottom:95px;animation-delay:-1s}

@keyframes particleFloat{
    0%,100%{
        transform:translateY(0);
        opacity:.4;
    }

    50%{
        transform:translateY(-25px);
        opacity:1;
    }
}

/* =========================================================
   GENERAL
========================================================= */

section{
    padding:115px 4%;
}

.container{
    width:min(var(--max),100%);
    margin:auto;
}

.label{
    color:#7284ff;

    font-size:10px;
    font-weight:800;

    letter-spacing:3px;
    text-transform:uppercase;
}

.section-title{
    margin-top:13px;

    max-width:850px;

    font-family:Manrope,Arial,sans-serif;

    font-size:clamp(38px,5vw,65px);
    line-height:.98;

    letter-spacing:-4px;
}

.section-text{
    max-width:680px;

    margin-top:20px;

    color:#8d94a8;

    font-size:14px;
    line-height:1.9;
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:70px;

    align-items:center;
}

.about-copy p{
    max-width:620px;

    margin-top:20px;

    color:#9299ac;

    font-size:14px;
    line-height:2;
}

.about-stage{
    position:relative;

    min-height:400px;

    overflow:hidden;

    border:1px solid var(--line);
    border-radius:30px;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(80,104,255,.18),
            transparent 42%
        ),
        rgba(255,255,255,.025);

    box-shadow:
        inset 0 1px rgba(255,255,255,.04),
        0 35px 100px rgba(0,0,0,.30);
}

.about-stage .small-core{
    position:absolute;

    width:115px;
    height:115px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #7385ff 20%,
            #273de2 52%,
            #080b20 78%
        );

    box-shadow:
        0 0 70px rgba(85,105,255,.55),
        inset -18px -20px 25px rgba(0,0,0,.55);
}

.about-stage .small-orbit{
    position:absolute;

    width:270px;
    height:95px;

    left:50%;
    top:50%;

    margin-left:-135px;
    margin-top:-47px;

    border:1px solid rgba(101,122,255,.28);
    border-radius:50%;

    transform:rotateX(68deg) rotateZ(-25deg);

    animation:orbit1 12s linear infinite;
}

/* =========================================================
   CARDS
========================================================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:17px;

    margin-top:55px;
}

.card{
    position:relative;

    min-height:275px;

    padding:29px;

    overflow:hidden;

    border:1px solid var(--line);
    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(18px);

    transition:
        transform .35s,
        border-color .35s,
        box-shadow .35s;
}

.card::before{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-90px;
    top:-90px;

    border-radius:50%;

    background:rgba(77,98,255,.16);

    filter:blur(25px);
}

.card:hover{
    transform:translateY(-9px);

    border-color:rgba(105,125,255,.38);

    box-shadow:
        0 30px 80px rgba(0,0,0,.38);
}

.card-icon{
    width:54px;
    height:54px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    border:1px solid rgba(108,129,255,.22);

    background:
        linear-gradient(
            145deg,
            rgba(84,105,255,.25),
            rgba(255,255,255,.04)
        );

    color:#aeb9ff;

    font-size:22px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.08);
}

.card h3{
    position:relative;

    margin-top:23px;

    font-family:Manrope,Arial,sans-serif;

    font-size:19px;
}

.card p{
    position:relative;

    margin-top:11px;

    color:#858ca0;

    font-size:12px;
    line-height:1.85;
}

/* =========================================================
   APPROACH
========================================================= */

.process{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-top:55px;
}

.process-card{
    padding:28px 24px;

    border-top:1px solid rgba(255,255,255,.13);

    transition:.3s;
}

.process-card:hover{
    transform:translateY(-7px);

    border-top-color:#6478ff;
}

.process-number{
    color:#6d80ff;

    font-size:11px;
    font-weight:800;
}

.process-card h3{
    margin-top:44px;

    font-family:Manrope,Arial,sans-serif;

    font-size:17px;
}

.process-card p{
    margin-top:11px;

    color:#858c9f;

    font-size:12px;
    line-height:1.8;
}

/* =========================================================
   VISION
========================================================= */

.vision-box{
    position:relative;

    overflow:hidden;

    padding:75px 60px;

    border:1px solid var(--line);
    border-radius:32px;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(82,105,255,.22),
            transparent 42%
        ),
        radial-gradient(
            circle at 90% 100%,
            rgba(0,180,255,.10),
            transparent 38%
        ),
        rgba(255,255,255,.025);

    box-shadow:
        0 40px 110px rgba(0,0,0,.35);
}

.vision-box::after{
    content:"";

    position:absolute;

    width:350px;
    height:350px;

    right:-160px;
    bottom:-220px;

    border:1px solid rgba(100,120,255,.18);

    border-radius:50%;

    box-shadow:
        0 0 0 40px rgba(100,120,255,.025),
        0 0 0 80px rgba(100,120,255,.015);
}

.vision-box h2{
    position:relative;
    z-index:2;

    max-width:850px;

    margin-top:15px;

    font-family:Manrope,Arial,sans-serif;

    font-size:clamp(38px,6vw,70px);

    line-height:.98;

    letter-spacing:-5px;
}

.vision-box p{
    position:relative;
    z-index:2;

    max-width:680px;

    margin-top:23px;

    color:#8d94a8;

    font-size:14px;
    line-height:1.9;
}

/* =========================================================
   TEAM / FOCUS
========================================================= */

.focus-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:17px;

    margin-top:50px;
}

.focus-card{
    padding:29px;

    border:1px solid var(--line);
    border-radius:21px;

    background:rgba(255,255,255,.025);
}

.focus-icon{
    font-size:22px;
}

.focus-card h3{
    margin-top:19px;

    font-family:Manrope,Arial,sans-serif;
}

.focus-card p{
    margin-top:10px;

    color:#858c9f;

    font-size:12px;
    line-height:1.8;
}

/* =========================================================
   CONTACT
========================================================= */

.contact{
    text-align:center;
}

.contact-box{
    position:relative;

    overflow:hidden;

    padding:90px 25px;

    border:1px solid rgba(102,124,255,.20);
    border-radius:32px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(80,104,255,.25),
            transparent 52%
        ),
        rgba(255,255,255,.025);

    box-shadow:
        0 45px 120px rgba(0,0,0,.40);
}

.contact-box::before{
    content:"";

    position:absolute;

    width:500px;
    height:500px;

    left:50%;
    top:-430px;

    transform:translateX(-50%);

    border-radius:50%;

    border:1px solid rgba(110,130,255,.12);

    box-shadow:
        0 0 0 55px rgba(110,130,255,.025),
        0 0 0 110px rgba(110,130,255,.015);
}

.contact-box > *{
    position:relative;
    z-index:2;
}

.contact-box h2{
    margin-top:14px;

    font-family:Manrope,Arial,sans-serif;

    font-size:clamp(40px,6vw,70px);

    line-height:.96;

    letter-spacing:-5px;
}

.contact-box p{
    max-width:620px;

    margin:20px auto 0;

    color:#8d94a8;

    font-size:14px;
    line-height:1.9;
}

.contact-actions{
    justify-content:center;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    border-top:1px solid rgba(255,255,255,.07);

    padding:35px 4%;
}

.footer{
    width:min(var(--max),100%);
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.footer-brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.footer-logo{
    width:31px;
    height:31px;
    object-fit:contain;
}

.footer-name{
    font-family:Manrope,Arial,sans-serif;

    font-size:11px;
    font-weight:800;

    letter-spacing:2px;
}

.footer-copy{
    color:#5f6576;
    font-size:10px;
}

.footer-email{
    color:#747b8e;
    text-decoration:none;

    font-size:11px;
}

.footer-email:hover{
    color:#fff;
}

/* =========================================================
   REVEAL
   Content remains visible by default.
========================================================= */

.reveal{
    opacity:1;
