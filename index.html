<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#05060b">

<meta name="description"
      content="CIRDRIO — Engineering ideas into intelligent products, digital systems and technology for what comes next.">

<meta name="keywords"
      content="CIRDRIO, technology, innovation, software, AI, digital products, engineering">

<meta name="author"
      content="CIRDRIO">

<title>CIRDRIO — Build What's Next</title>


<!-- =====================================================
     PREMIUM FONTS
===================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   ROOT SYSTEM
===================================================== */

:root{

    --bg:#05060a;
    --bg2:#080a12;

    --surface:rgba(255,255,255,.045);
    --surface-2:rgba(255,255,255,.07);

    --line:rgba(255,255,255,.10);
    --line-soft:rgba(255,255,255,.06);

    --text:#f7f8ff;
    --muted:#8e93a6;
    --muted2:#656a7c;

    --blue:#5b7cff;
    --blue2:#304dff;
    --cyan:#36d9ff;
    --violet:#8b5cf6;

    --radius:24px;

    --container:1180px;

}


/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:"DM Sans",sans-serif;

    color:var(--text);

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(74,91,255,.20),
            transparent 38%
        ),

        radial-gradient(
            circle at 100% 35%,
            rgba(54,217,255,.07),
            transparent 30%
        ),

        radial-gradient(
            circle at 0% 75%,
            rgba(139,92,246,.08),
            transparent 30%
        ),

        var(--bg);

    overflow-x:hidden;

}


/* =====================================================
   GLOBAL NOISE
===================================================== */

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:9999;

    opacity:.025;

    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");

}


/* =====================================================
   3D BACKGROUND
===================================================== */

#space{

    position:fixed;

    inset:0;

    z-index:-5;

    overflow:hidden;

    pointer-events:none;

}


.grid-floor{

    position:absolute;

    width:180vw;

    height:90vh;

    left:-40vw;

    bottom:-48vh;

    transform:
        perspective(650px)
        rotateX(64deg);

    background-image:

        linear-gradient(
            rgba(88,112,255,.14) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(88,112,255,.14) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to top,
            rgba(0,0,0,1),
            transparent 80%
        );

    animation:gridMove 12s linear infinite;

}


@keyframes gridMove{

    from{
        background-position:0 0,0 0;
    }

    to{
        background-position:0 70px,70px 0;
    }

}


/* =====================================================
   GLOW ORBS
===================================================== */

.glow{

    position:absolute;

    border-radius:50%;

    filter:blur(70px);

    opacity:.32;

    animation:orbFloat 12s ease-in-out infinite;

}


.glow.one{

    width:340px;
    height:340px;

    left:-160px;
    top:15%;

    background:#304dff;

}


.glow.two{

    width:300px;
    height:300px;

    right:-120px;
    top:35%;

    background:#5b2cff;

    animation-delay:-4s;

}


.glow.three{

    width:250px;
    height:250px;

    left:35%;
    bottom:-120px;

    background:#009dff;

    animation-delay:-7s;

}


@keyframes orbFloat{

    0%,100%{
        transform:translate3d(0,0,0);
    }

    50%{
        transform:translate3d(0,-45px,0) scale(1.08);
    }

}


/* =====================================================
   PARTICLE CANVAS
===================================================== */

#particles{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    opacity:.65;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:min(
        calc(100% - 40px),
        var(--container)
    );

    margin:auto;

}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{

    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:1000;

    padding:18px 0;

    transition:.35s;

}


.navbar.scrolled{

    padding:11px 0;

    background:rgba(5,6,10,.72);

    backdrop-filter:blur(22px);

    border-bottom:1px solid var(--line-soft);

}


.nav-inner{

    width:min(
        calc(100% - 40px),
        1240px
    );

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 12px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(7,8,14,.48);

    backdrop-filter:blur(18px);

    border-radius:18px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.18);

}


.brand{

    display:flex;

    align-items:center;

    gap:11px;

    text-decoration:none;

    color:white;

}


.brand-logo{

    width:39px;
    height:39px;

    object-fit:contain;

    border-radius:10px;

    background:#fff;

    padding:3px;

    box-shadow:
        0 0 25px rgba(82,100,255,.25);

}


.brand-name{

    font-family:"Manrope",sans-serif;

    font-weight:800;

    font-size:16px;

    letter-spacing:2px;

}


.nav-links{

    display:flex;

    align-items:center;

    gap:30px;

}


.nav-links a{

    color:#9297aa;

    text-decoration:none;

    font-size:12px;

    font-weight:600;

    transition:.25s;

}


.nav-links a:hover{

    color:#fff;

}


.nav-cta{

    padding:11px 17px;

    border-radius:11px;

    text-decoration:none;

    color:#fff;

    font-size:12px;

    font-weight:700;

    background:
        linear-gradient(
            135deg,
            #617eff,
            #3949e9
        );

    box-shadow:
        0 8px 25px rgba(62,78,255,.28);

}


.menu{

    display:none;

    width:42px;
    height:42px;

    border:1px solid var(--line);

    background:rgba(255,255,255,.04);

    border-radius:12px;

    color:white;

    font-size:20px;

}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:100vh;

    display:flex;

    align-items:center;

    padding:
        150px 0
        100px;

    position:relative;

}


.hero-content{

    max-width:900px;

}


.eyebrow{

    display:inline-flex;

    align-items:center;

    gap:10px;

    padding:8px 13px;

    border-radius:100px;

    border:1px solid rgba(112,130,255,.25);

    background:rgba(80,90,255,.07);

    color:#a9b2ff;

    font-size:11px;

    font-weight:700;

    letter-spacing:1.5px;

    text-transform:uppercase;

}


.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#4cffae;

    box-shadow:0 0 15px #4cffae;

}


.hero h1{

    margin-top:28px;

    font-family:"Manrope",sans-serif;

    font-size:
        clamp(
            54px,
            9vw,
            108px
        );

    line-height:.91;

    letter-spacing:-6px;

    font-weight:800;

}


.gradient-text{

    background:
        linear-gradient(
            110deg,
            #fff 15%,
            #c9ceff 40%,
            #6f7fff 65%,
            #fff 90%
        );

    background-size:220% auto;

    color:transparent;

    -webkit-background-clip:text;

    background-clip:text;

    animation:textShine 6s linear infinite;

}


@keyframes textShine{

    to{
        background-position:220% center;
    }

}


.hero-description{

    max-width:670px;

    margin-top:30px;

    color:var(--muted);

    font-size:16px;

    line-height:1.9;

}


.hero-buttons{

    display:flex;

    flex-wrap:wrap;

    gap:13px;

    margin-top:36px;

}


.button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    min-height:48px;

    padding:0 21px;

    border-radius:12px;

    text-decoration:none;

    font-size:12px;

    font-weight:700;

    transition:.35s;

}


.button-primary{

    color:white;

    background:
        linear-gradient(
            135deg,
            #637fff,
            #3648e8
        );

    box-shadow:
        0 15px 35px rgba(55,73,235,.28);

}


.button-primary:hover{

    transform:translateY(-4px);

    box-shadow:
        0 20px 45px rgba(55,73,235,.42);

}


.button-secondary{

    color:#dfe2ee;

    border:1px solid var(--line);

    background:rgba(255,255,255,.035);

}


.button-secondary:hover{

    background:rgba(255,255,255,.08);

    transform:translateY(-4px);

}


.hero-meta{

    display:flex;

    flex-wrap:wrap;

    gap:25px;

    margin-top:55px;

    color:#686e82;

    font-size:11px;

}


.hero-meta strong{

    color:#c7cad7;

}


/* =====================================================
   3D HERO OBJECT
===================================================== */

.hero-visual{

    position:absolute;

    right:-90px;

    top:50%;

    transform:
        translateY(-50%);

    width:470px;
    height:470px;

    pointer-events:none;

}


.core{

    position:absolute;

    width:210px;
    height:210px;

    left:130px;
    top:130px;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 30% 25%,
            #dce3ff,
            #7181ff 15%,
            #3346f5 38%,
            #090b18 70%
        );

    box-shadow:

        0 0 70px rgba(74,94,255,.42),

        inset -30px -25px 50px rgba(0,0,0,.65),

        inset 15px 15px 25px rgba(255,255,255,.25);

    animation:coreFloat 7s ease-in-out infinite;

}


.ring{

    position:absolute;

    border:1px solid rgba(103,121,255,.38);

    border-radius:50%;

}


.ring.one{

    width:330px;
    height:110px;

    left:70px;
    top:180px;

    transform:
        rotateX(65deg)
        rotateZ(-20deg);

    animation:ringSpin 12s linear infinite;

}


.ring.two{

    width:390px;
    height:145px;

    left:40px;
    top:160px;

    transform:
        rotateX(70deg)
        rotateZ(45deg);

    animation:ringSpin 17s linear infinite reverse;

}


.ring.three{

    width:270px;
    height:270px;

    left:100px;
    top:100px;

    border-color:rgba(54,217,255,.18);

    animation:ringRotate 20s linear infinite;

}


@keyframes coreFloat{

    0%,100%{
        transform:translateY(0) rotate(0);
    }

    50%{
        transform:translateY(-18px) rotate(8deg);
    }

}


@keyframes ringSpin{

    to{
        transform:
            rotateX(65deg)
            rotateZ(340deg);
    }

}


@keyframes ringRotate{

    to{
        transform:rotateZ(360deg);
    }

}


/* =====================================================
   SECTION
===================================================== */

section{

    padding:125px 0;

    position:relative;

}


.section-head{

    max-width:700px;

    margin-bottom:55px;

}


.section-label{

    color:#7180ff;

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:3px;

}


.section-title{

    margin-top:13px;

    font-family:"Manrope",sans-serif;

    font-size:
        clamp(
            34px,
            5vw,
            58px
        );

    line-height:1;

    letter-spacing:-3px;

}


.section-description{

    margin-top:18px;

    color:var(--muted);

    line-height:1.8;

    font-size:14px;

}


/* =====================================================
   STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-top:80px;

}


.stat{

    padding:27px;

    border:
        1px solid
        var(--line-soft);

    border-radius:18px;

    background:
        rgba(255,255,255,.025);

}


.stat-number{

    font-family:"Manrope",sans-serif;

    font-size:30px;

    font-weight:800;

}


.stat-label{

    margin-top:7px;

    color:var(--muted2);

    font-size:11px;

}


/* =====================================================
   GLASS CARDS
===================================================== */

.cards{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:17px;

}


.card{

    position:relative;

    min-height:300px;

    padding:30px;

    border-radius:22px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(18px);

    transform-style:preserve-3d;

    transition:
        transform .15s ease,
        border-color .3s,
        box-shadow .3s;

}


.card::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-100px;
    top:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(91,124,255,.42),
            transparent 65%
        );

    filter:blur(15px);

}


.card:hover{

    border-color:
        rgba(99,124,255,.32);

    box-shadow:
        0 30px 80px rgba(0,0,0,.35);

}


.card-number{

    color:#5e6680;

    font-family:"Manrope",sans-serif;

    font-size:11px;

    font-weight:800;

}


.card-icon{

    width:54px;
    height:54px;

    margin-top:35px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    font-size:23px;

    background:
        linear-gradient(
            145deg,
            rgba(94,112,255,.25),
            rgba(255,255,255,.04)
        );

    border:
        1px solid
        rgba(120,135,255,.18);

    box-shadow:
        inset 0 1px rgba(255,255,255,.15),
        0 15px 30px rgba(0,0,0,.25);

    transform:translateZ(30px);

}


.card h3{

    margin-top:25px;

    font-family:"Manrope",sans-serif;

    font-size:20px;

    transform:translateZ(25px);

}


.card p{

    margin-top:12px;

    color:var(--muted);

    font-size:12px;

    line-height:1.8;

    transform:translateZ(20px);

}


/* =====================================================
   ABOUT SPLIT
===================================================== */

.about-grid{

    display:grid;

    grid-template-columns:
        1.1fr .9fr;

    gap:70px;

    align-items:center;

}


.about-copy p{

    color:var(--muted);

    line-height:2;

    font-size:15px;

}


.about-copy p + p{

    margin-top:18px;

}


.about-visual{

    min-height:390px;

    border-radius:28px;

    position:relative;

    overflow:hidden;

    border:1px solid var(--line);

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(83,100,255,.22),
            transparent 45%
        ),

        rgba(255,255,255,.025);

}


.about-visual::before{

    content:"";

    position:absolute;

    inset:20px;

    border:
        1px solid
        rgba(105,120,255,.13);

    border-radius:22px;

}


.about-visual::after{

    content:"CIRDRIO";

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:"Manrope",sans-serif;

    font-weight:800;

    font-size:48px;

    letter-spacing:8px;

    color:rgba(255,255,255,.045);

}


.about-core{

    position:absolute;

    width:130px;
    height:130px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #dfe4ff,
            #566aff 25%,
            #141a57 65%,
            #06070c
        );

    box-shadow:
        0 0 70px rgba(80,100,255,.4);

    animation:
        coreFloat 6s ease-in-out infinite;

}


/* =====================================================
   PROCESS
===================================================== */

.process{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

}


.process-item{

    padding:28px;

    border-top:
        1px solid
        rgba(255,255,255,.1);

    transition:.3s;

}


.process-item:hover{

    border-top-color:
        #6478ff;

    transform:translateY(-5px);

}


.process-number{

    color:#6576ff;

    font-family:"Manrope",sans-serif;

    font-size:12px;

    font-weight:800;

}


.process h3{

    margin-top:45px;

    font-size:17px;

}


.process p{

    margin-top:10px;

    color:var(--muted);

    font-size:12px;

    line-height:1.8;

}


/* =====================================================
   VISION
===================================================== */

.vision-box{

    padding:75px 60px;

    border-radius:30px;

    border:1px solid var(--line);

    background:

        radial-gradient(
            circle at 20% 0%,
            rgba(76,91,255,.20),
            transparent 40%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(54,217,255,.07),
            transparent 35%
        ),

        rgba(255,255,255,.025);

    box-shadow:
        0 35px 100px rgba(0,0,0,.3);

}


.vision-box h2{

    max-width:850px;

    font-family:"Manrope",sans-serif;

    font-size:
        clamp(
            34px,
            6vw,
            68px
        );

    line-height:1;

    letter-spacing:-4px;

}


.vision-box p{

    max-width:700px;

    margin-top:25px;

    color:var(--muted);

    line-height:1.9;

}


/* =====================================================
   TEAM
===================================================== */

.team-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

}


.team-card{

    padding:30px;

    border-radius:20px;

    border:1px solid var(--line-soft);

    background:rgba(255,255,255,.025);

}


.team-icon{

    font-size:23px;

}


.team-card h3{

    margin-top:20px;

    font-size:17px;

}


.team-card p{

    margin-top:9px;

    color:var(--muted);

    font-size:12px;

    line-height:1.8;

}


/* =====================================================
   CONTACT CTA
===================================================== */

.contact{

    padding-bottom:130px;

}


.contact-box{

    position:relative;

    overflow:hidden;

    text-align:center;

    padding:
        90px 25px;

    border-radius:32px;

    border:1px solid rgba(108,125,255,.18);

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(80,100,255,.24),
            transparent 55%
        ),

        rgba(255,255,255,.025);

    box-shadow:
        0 40px 120px rgba(0,0,0,.4);

}


.contact-box h2{

    font-family:"Manrope",sans-serif;

    font-size:
        clamp(
            38px,
            6vw,
            70px
        );

    line-height:1;

    letter-spacing:-4px;

}


.contact-box p{

    max-width:580px;

    margin:20px auto 0;

    color:var(--muted);

    line-height:1.8;

}


.contact-box .hero-buttons{

    justify
