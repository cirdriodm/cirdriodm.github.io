<html lang="en">
<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07080d;
      color: #f5f5f7;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {

      margin: auto;
    }

    /* NAVBAR */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 8, 13, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #1c1e27;
    }

    .nav-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .logo span {
      color: #a855f7;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #b8bac4;
      font-size: 14px;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }
